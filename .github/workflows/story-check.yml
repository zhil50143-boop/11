name: Story checks
on:
  push:
    branches: ["codex/chapter01-slice"]
  pull_request:
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - run: node -e "console.log('LOCK_JSON_BEGIN'); console.log(require('node:fs').readFileSync('package-lock.json','utf8')); console.log('LOCK_JSON_END')"
      - run: npm run check:types
      - run: npm run check:story
      - run: npm test
